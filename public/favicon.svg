<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="#174936"/>
  <!-- Gift box body -->
  <rect x="14" y="30" width="36" height="22" rx="3" fill="#f2c65d"/>
  <!-- Gift box lid -->
  <rect x="12" y="24" width="40" height="8" rx="3" fill="#f2c65d"/>
  <!-- Vertical ribbon -->
  <rect x="29" y="24" width="6" height="28" fill="#174936" opacity="0.25"/>
  <!-- Horizontal ribbon -->
  <rect x="14" y="33" width="36" height="5" fill="#174936" opacity="0.25"/>
  <!-- Bow - left loop -->
  <ellipse cx="26" cy="21" rx="7" ry="5" fill="#f2c65d" stroke="#174936" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Bow - right loop -->
  <ellipse cx="38" cy="21" rx="7" ry="5" fill="#f2c65d" stroke="#174936" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Bow - knot -->
  <circle cx="32" cy="22" r="3.5" fill="#a92e3b"/>
  <!-- Star accent -->
  <g transform="translate(46,12)" fill="#fffdf7" opacity="0.7">
    <polygon points="0,-4 1.2,-1.2 4,0 1.2,1.2 0,4 -1.2,1.2 -4,0 -1.2,-1.2"/>
  </g>
</svg>
